name: Deploy to GitHub Pages

on:
  push:
    branches: [feature/angular-makeover, main, v1]
  workflow_dispatch:

permissions:
  contents: write

# Only one deploy in flight at a time. A newer push cancels an older
# in-progress run so we never publish a stale build over a fresh one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2 (feature/angular-makeover)
        uses: actions/checkout@v4
        with:
          ref: feature/angular-makeover
          path: v2

      - name: Checkout v1 (frozen branch)
        uses: actions/checkout@v4
        with:
          ref: v1
          path: v1

      - name: Assemble deploy tree (v2 at /, v1 at /v1/)
        run: |
          mkdir -p dist/v1
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' v2/ dist/
          cp v1/index.html dist/v1/index.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: "Deploy ${{ github.sha }}"

      - name: Summary
        run: |
          echo "### Deployed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **v2:** https://amandarae220.github.io/Calculator2.0/" >> $GITHUB_STEP_SUMMARY
          echo "- **v1:** https://amandarae220.github.io/Calculator2.0/v1/" >> $GITHUB_STEP_SUMMARY
